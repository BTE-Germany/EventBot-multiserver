<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }

        .info-box strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Booster Manager</h1>
        <p class="subtitle">Grant boosters to users</p>

        <div class="info-box">
            <strong>Booster Types:</strong><br>
            • <strong>Points:</strong> Add bonus points to users<br>
            • <strong>Multiplier:</strong> Multiply points earned (e.g., 2.0 = 2x points)
        </div>

        <form id="boosterForm">
            <div class="form-group">
                <label for="user_id">User ID *</label>
                <input type="text" id="user_id" name="user_id" required 
                       placeholder="Enter Discord user ID">
            </div>

            <div class="form-group">
                <label for="type">Booster Type *</label>
                <select id="type" name="type" required>
                    <option value="">Select type...</option>
                    <option value="points">Points</option>
                    <option value="multiplier">Multiplier</option>
                </select>
            </div>

            <div class="form-group">
                <label for="value">Value *</label>
                <input type="number" id="value" name="value" step="0.01" required 
                       placeholder="e.g., 100 for points or 2.0 for multiplier">
            </div>

            <div class="form-group">
                <label for="duration">Duration (minutes, optional)</label>
                <input type="number" id="duration" name="duration" 
                       placeholder="Leave empty for permanent booster">
            </div>

            <button type="submit" id="submitBtn">Grant Booster</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        const form = document.getElementById('boosterForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Granting Booster...';
            messageDiv.style.display = 'none';

            // Get form data
            const formData = {
                user_id: document.getElementById('user_id').value,
                type: document.getElementById('type').value,
                value: parseFloat(document.getElementById('value').value),
                duration: document.getElementById('duration').value ? 
                         parseInt(document.getElementById('duration').value) : null
            };

            try {
                // Make API request
                const response = await fetch('/grant_booster', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('success', 
                        `✅ Booster granted successfully to user ${formData.user_id}!`);
                    form.reset();
                } else {
                    showMessage('error', 
                        `❌ Error: ${data.error || 'Failed to grant booster'}`);
                }
            } catch (error) {
                showMessage('error', 
                    `❌ Network error: ${error.message}`);
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Grant Booster';
            }
        });

        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }

        // Add value placeholder helper based on type
        document.getElementById('type').addEventListener('change', (e) => {
            const valueInput = document.getElementById('value');
            if (e.target.value === 'points') {
                valueInput.placeholder = 'e.g., 100';
                valueInput.step = '1';
            } else if (e.target.value === 'multiplier') {
                valueInput.placeholder = 'e.g., 2.0 for 2x multiplier';
                valueInput.step = '0.1';
            }
        });
    </script>
</body>
</html>
