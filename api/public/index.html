<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booster Management (Vibecoded for your enjoyment)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        .user-select-wrapper {
            position: relative;
        }

        #userSearchInput {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
        }

        #userSearchInput:focus {
            outline: none;
            border-color: #667eea;
        }

        .user-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 2px solid #e0e0e0;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .user-dropdown.show {
            display: block;
        }

        .user-option {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
            transition: background-color 0.2s;
        }

        .user-option:hover {
            background-color: #f8f9fa;
        }

        .user-option:last-child {
            border-bottom: none;
        }

        .user-option-name {
            font-weight: 600;
            color: #333;
        }

        .user-option-id {
            font-size: 12px;
            color: #666;
            margin-top: 2px;
        }

        .loading {
            padding: 12px;
            text-align: center;
            color: #666;
        }

        .no-results {
            padding: 12px;
            text-align: center;
            color: #999;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .info-box {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 13px;
            color: #555;
        }

        .info-box strong {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎁 Booster Manager</h1>
        <p class="subtitle">Grant boosters to users</p>

        <div class="info-box">
            <strong>Booster Types:</strong><br>
            • <strong>Points:</strong> Add bonus points to users<br>
            • <strong>Multiplier:</strong> Multiply points earned (e.g., 2.0 = 2x points)
        </div>

        <form id="boosterForm">
            <div class="form-group">
                <label for="user_id">Select User *</label>
                <div class="user-select-wrapper">
                    <input type="text" id="userSearchInput" 
                           placeholder="Search by Minecraft username or Discord ID..." 
                           autocomplete="off">
                    <input type="hidden" id="user_id" name="user_id" required>
                    <div id="userDropdown" class="user-dropdown"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="type">Booster Type *</label>
                <select id="type" name="type" required>
                    <option value="">Select type...</option>
                    <option value="points">Points</option>
                    <option value="multiplier">Multiplier</option>
                </select>
            </div>

            <div class="form-group">
                <label for="value">Value *</label>
                <input type="number" id="value" name="value" step="0.01" required 
                       placeholder="e.g., 100 for points or 2.0 for multiplier">
            </div>

            <div class="form-group">
                <label for="duration">Duration (minutes, optional)</label>
                <input type="number" id="duration" name="duration" 
                       placeholder="Leave empty for permanent booster">
            </div>

            <button type="submit" id="submitBtn">Grant Booster</button>
        </form>

        <div id="message" class="message"></div>
    </div>

    <script>
        const form = document.getElementById('boosterForm');
        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        const userSearchInput = document.getElementById('userSearchInput');
        const userDropdown = document.getElementById('userDropdown');
        const userIdInput = document.getElementById('user_id');
        
        let allUsers = [];
        let filteredUsers = [];

        // Fetch users on page load
        async function loadUsers() {
            try {
                userDropdown.innerHTML = '<div class="loading">Loading users...</div>';
                const response = await fetch('/users');
                allUsers = await response.json();
                userDropdown.innerHTML = '';
                console.log(`Loaded ${allUsers.length} users`);
            } catch (error) {
                console.error('Error loading users:', error);
                userDropdown.innerHTML = '<div class="no-results">Error loading users</div>';
            }
        }

        // Filter and display users
        function filterUsers(searchTerm) {
            if (!searchTerm) {
                filteredUsers = allUsers.slice(0, 50); // Show first 50 users
            } else {
                const term = searchTerm.toLowerCase();
                filteredUsers = allUsers.filter(user => 
                    user.minecraft_id.toLowerCase().includes(term) || 
                    user.id.includes(term)
                ).slice(0, 50); // Limit to 50 results
            }
            
            displayUsers();
        }

        // Display filtered users
        function displayUsers() {
            if (filteredUsers.length === 0) {
                userDropdown.innerHTML = '<div class="no-results">No users found</div>';
            } else {
                userDropdown.innerHTML = filteredUsers.map(user => `
                    <div class="user-option" data-id="${user.id}">
                        <div class="user-option-name">${user.minecraft_id}</div>
                        <div class="user-option-id">ID: ${user.id}</div>
                    </div>
                `).join('');
                
                // Add click handlers
                document.querySelectorAll('.user-option').forEach(option => {
                    option.addEventListener('click', () => {
                        const userId = option.dataset.id;
                        const userName = option.querySelector('.user-option-name').textContent;
                        selectUser(userId, userName);
                    });
                });
            }
            
            userDropdown.classList.add('show');
        }

        // Select a user
        function selectUser(id, name) {
            userIdInput.value = id;
            userSearchInput.value = `${name} (${id})`;
            userDropdown.classList.remove('show');
        }

        // Show dropdown on focus
        userSearchInput.addEventListener('focus', () => {
            if (allUsers.length > 0) {
                filterUsers(userSearchInput.value);
            }
        });

        // Filter on input
        userSearchInput.addEventListener('input', (e) => {
            userIdInput.value = ''; // Clear selection when typing
            filterUsers(e.target.value);
        });

        // Hide dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.user-select-wrapper')) {
                userDropdown.classList.remove('show');
            }
        });

        // Load users when page loads
        loadUsers();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Disable button and show loading state
            submitBtn.disabled = true;
            submitBtn.textContent = 'Granting Booster...';
            messageDiv.style.display = 'none';

            // Get form data
            const formData = {
                user_id: document.getElementById('user_id').value,
                type: document.getElementById('type').value,
                value: parseFloat(document.getElementById('value').value),
                duration: document.getElementById('duration').value ? 
                         parseInt(document.getElementById('duration').value) : null
            };

            try {
                // Make API request
                const response = await fetch('/grant_booster', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    showMessage('success', 
                        `✅ Booster granted successfully to user ${formData.user_id}!`);
                    form.reset();
                } else {
                    showMessage('error', 
                        `❌ Error: ${data.error || 'Failed to grant booster'}`);
                }
            } catch (error) {
                showMessage('error', 
                    `❌ Network error: ${error.message}`);
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = 'Grant Booster';
            }
        });

        function showMessage(type, text) {
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            messageDiv.style.display = 'block';
        }

        // Add value placeholder helper based on type
        document.getElementById('type').addEventListener('change', (e) => {
            const valueInput = document.getElementById('value');
            if (e.target.value === 'points') {
                valueInput.placeholder = 'e.g., 100';
                valueInput.step = '1';
            } else if (e.target.value === 'multiplier') {
                valueInput.placeholder = 'e.g., 2.0 for 2x multiplier';
                valueInput.step = '0.1';
            }
        });
    </script>
</body>
</html>
