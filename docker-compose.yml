services:
  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "6969:6969"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://prisma:prisma@postgres:5432/db
    restart: unless-stopped
    # The Privacy Policy promises server logs are kept at most 30 days;
    # size-based rotation keeps them short, prune older logs on the host if needed
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=prisma
      - POSTGRES_PASSWORD=prisma
      - POSTGRES_DB=db
    volumes:
      - eventbot-multiserver-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d db"]
      interval: 5s
      retries: 20
    restart: unless-stopped

volumes:
  eventbot-multiserver-db:
